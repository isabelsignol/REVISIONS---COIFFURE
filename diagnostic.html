<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le diagnostic capillaire — Quiz CAP coiffure</title><style>:root{--accent:#2764b0}*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17243c;font:18px Arial,sans-serif}main{max-width:780px;margin:30px auto;padding:18px}.hero{background:var(--accent);color:white;padding:28px;border-radius:20px}h1{font-size:clamp(26px,5vw,38px);margin:8px 0}.small{opacity:.9;font-size:16px}.panel{background:white;border-radius:18px;padding:26px;margin-top:18px;box-shadow:0 6px 24px #152a4a12}.bar{height:12px;background:#e3eaf2;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--accent);width:0;transition:width .2s}button{font:inherit;cursor:pointer}.choice{display:block;text-align:left;width:100%;border:2px solid #d9e1ed;border-radius:12px;padding:16px;margin:12px 0;background:white}.choice:hover:not(:disabled){border-color:var(--accent)}.choice:disabled{cursor:default}.right{background:#e4f7e9!important;border-color:#1a9448!important}.wrong{background:#fff0ef!important;border-color:#cf3b32!important}.feedback{padding:16px;border-radius:12px;background:#f0f5fc;margin-top:15px}.primary{background:var(--accent);border:0;color:white;border-radius:12px;padding:14px 22px;margin-top:16px;font-weight:bold}.primary:disabled{opacity:.45}#score{font-size:24px;font-weight:bold}.muted{color:#52627a;font-size:15px}@media(max-width:600px){main{margin:0;padding:10px}.panel{padding:18px}}</style></head><body><main><header class="hero"><div class="small">CAP Métiers de la coiffure · Révisions interactives</div><h1>Le diagnostic capillaire</h1><div>Pages 1 à 7 · 20 questions · Correction immédiate</div></header><section class="panel" id="game"><p id="progressLabel" class="muted"></p><div class="bar"><div class="fill" id="fill"></div></div><h2 id="question"></h2><div id="choices"></div><div id="feedback" class="feedback" hidden aria-live="polite"></div><button id="next" class="primary" disabled>Question suivante</button></section><section class="panel" id="end" hidden><h2>Quiz terminé !</h2><p id="score"></p><p id="message"></p><button id="restart" class="primary">Recommencer</button></section><p class="muted">Réalisé à partir du support de cours fourni. Ce quiz est un entraînement pédagogique.</p></main><script>const QUESTIONS=[{"q": "Pourquoi interroger le client avant une prestation ?", "a": ["Pour connaître sa demande et ses attentes", "Pour choisir la musique", "Pour éviter de regarder les cheveux"], "correct": 0, "why": "Le diagnostic commence par la demande et le résultat souhaité."}, {"q": "Quelle information relève des habitudes du client ?", "a": ["Sa pointure", "La fréquence des shampooings", "Son moyen de transport"], "correct": 1, "why": "La fréquence de lavage fait partie des habitudes capillaires."}, {"q": "Quel appareil chauffant est cité dans la fiche ?", "a": ["Une tondeuse à gazon", "Un four", "Un lisseur"], "correct": 2, "why": "La fiche interroge sur le sèche-cheveux, le lisseur, le fer à boucler et la brosse chauffante."}, {"q": "Pourquoi demander les techniques chimiques déjà réalisées ?", "a": ["Pour connaître l’historique technique", "Pour établir le prix du parking", "Pour choisir le fauteuil"], "correct": 0, "why": "L’historique technique aide à adapter la prestation."}, {"q": "Que faut-il rechercher dans l’historique du client ?", "a": ["Son parfum", "Une éventuelle réaction à un produit", "Sa couleur préférée"], "correct": 1, "why": "La fiche prévoit de noter les réactions antérieures aux produits."}, {"q": "Quelles sont les trois natures de cuir chevelu proposées ?", "a": ["Long, court, mi-long", "Lisse, bouclé, frisé", "Normal, sec, gras"], "correct": 2, "why": "La fiche distingue les cuirs chevelus normal, sec et gras."}, {"q": "Que doit-on relever lors de l’observation du cuir chevelu ?", "a": ["Rougeurs, pellicules ou irritations", "La couleur du peignoir", "La marque du téléphone"], "correct": 0, "why": "L’état du cuir chevelu peut révéler différentes anomalies."}, {"q": "Quelle sensation le client peut-il signaler ?", "a": ["La faim", "Des démangeaisons", "La fatigue des jambes"], "correct": 1, "why": "Démangeaisons, picotements, douleurs et tiraillements sont proposés."}, {"q": "Quelle caractéristique décrit la texture des cheveux ?", "a": ["Leur prix", "Leur odeur", "Raides, ondulés, bouclés ou crépus"], "correct": 2, "why": "La texture est une observation distincte du diamètre et de la densité."}, {"q": "Que désigne la densité capillaire ?", "a": ["La quantité de cheveux implantés", "La longueur des pointes", "Le diamètre d’un seul cheveu"], "correct": 0, "why": "La densité est classée faible, moyenne ou forte."}, {"q": "Comment la fiche classe-t-elle le diamètre des cheveux ?", "a": ["Secs, gras, sains", "Fins, moyens, gros", "Courts, longs, très longs"], "correct": 1, "why": "Le diamètre correspond à l’épaisseur du cheveu."}, {"q": "Quel signe figure dans l’état des cheveux ?", "a": ["La couleur des yeux", "Le type de lunettes", "Des pointes fourchues"], "correct": 2, "why": "La fiche propose notamment cassants, poreux et fourchus."}, {"q": "Que vérifie-t-on dans la partie couleur ?", "a": ["La présence de repousses", "La couleur du siège", "La taille du miroir"], "correct": 0, "why": "La fiche prévoit de mesurer la longueur des repousses."}, {"q": "Pourquoi observer les épis ?", "a": ["Pour choisir la serviette", "Pour tenir compte de l’implantation naturelle", "Pour calculer le temps de pause"], "correct": 1, "why": "Les épis et la direction naturelle influencent la coiffure."}, {"q": "Quel élément morphologique est observé ?", "a": ["La forme des chaussures", "La taille du salon", "La forme du visage"], "correct": 2, "why": "La fiche présente notamment les visages ovale, rond, carré et triangulaire."}, {"q": "Que signifie une forte porosité ?", "a": ["Le cheveu absorbe vite l’eau mais la retient mal", "Le cheveu ne peut jamais être mouillé", "Le cheveu est forcément très épais"], "correct": 0, "why": "La porosité forte correspond à une absorption rapide et une faible rétention."}, {"q": "Quelle porosité correspond à un équilibre d’absorption et de rétention ?", "a": ["Forte", "Moyenne", "Nulle"], "correct": 1, "why": "La porosité moyenne permet une absorption et une rétention équilibrées."}, {"q": "Si une anomalie importante est constatée, que doit faire le coiffeur ?", "a": ["L’ignorer", "Poser un diagnostic médical", "Adapter ou reporter la prestation et orienter si nécessaire"], "correct": 2, "why": "La fiche prévoit plusieurs conduites selon l’anomalie, sans diagnostic médical."}, {"q": "Sur quoi doit reposer le choix du shampooing et du soin ?", "a": ["Le diagnostic et les besoins du client", "La couleur du flacon uniquement", "Le hasard"], "correct": 0, "why": "La fiche demande de justifier chaque produit choisi."}, {"q": "Que comprend la dernière partie du diagnostic ?", "a": ["Une facture de restaurant", "Des conseils à domicile et une autoévaluation", "Un plan de transport"], "correct": 1, "why": "La fiche se termine par des conseils au client et l’avis de l’élève."}];let index=0,score=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;const x=QUESTIONS[index];$('progressLabel').textContent=`Question ${index+1} sur ${QUESTIONS.length} · Score actuel : ${score}`;$('fill').style.width=`${index/QUESTIONS.length*100}%`;$('question').textContent=x.q;$('choices').innerHTML='';$('feedback').hidden=true;$('next').disabled=true;$('next').textContent=index===QUESTIONS.length-1?'Voir mon résultat':'Question suivante';x.a.forEach((answer,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=`${String.fromCharCode(65+i)}. ${answer}`;b.onclick=()=>select(i);$('choices').appendChild(b)})}function select(i){if(answered)return;answered=true;const x=QUESTIONS[index];if(i===x.correct)score++;[...$('choices').children].forEach((b,j)=>{b.disabled=true;if(j===x.correct)b.classList.add('right');else if(j===i)b.classList.add('wrong')});$('feedback').hidden=false;$('feedback').textContent=(i===x.correct?'✓ Bonne réponse ! ':'✗ Pas tout à fait. ')+x.why;$('next').disabled=false}$('next').onclick=()=>{index++;if(index<QUESTIONS.length)render();else{ $('game').hidden=true;$('end').hidden=false;$('score').textContent=`${score} / ${QUESTIONS.length}`;$('message').textContent=score>=17?'Excellent travail !':score>=12?'Bon début : révise les questions difficiles.':'Relis ton cours puis recommence le quiz.'}};$('restart').onclick=()=>{index=0;score=0;$('end').hidden=true;$('game').hidden=false;render()};render();</script></body></html>
