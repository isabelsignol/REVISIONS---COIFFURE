<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Les règles d’hygiène — Quiz CAP coiffure</title><style>:root{--accent:#16845b}*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17243c;font:18px Arial,sans-serif}main{max-width:780px;margin:30px auto;padding:18px}.hero{background:var(--accent);color:white;padding:28px;border-radius:20px}h1{font-size:clamp(26px,5vw,38px);margin:8px 0}.small{opacity:.9;font-size:16px}.panel{background:white;border-radius:18px;padding:26px;margin-top:18px;box-shadow:0 6px 24px #152a4a12}.bar{height:12px;background:#e3eaf2;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--accent);width:0;transition:width .2s}button{font:inherit;cursor:pointer}.choice{display:block;text-align:left;width:100%;border:2px solid #d9e1ed;border-radius:12px;padding:16px;margin:12px 0;background:white}.choice:hover:not(:disabled){border-color:var(--accent)}.choice:disabled{cursor:default}.right{background:#e4f7e9!important;border-color:#1a9448!important}.wrong{background:#fff0ef!important;border-color:#cf3b32!important}.feedback{padding:16px;border-radius:12px;background:#f0f5fc;margin-top:15px}.primary{background:var(--accent);border:0;color:white;border-radius:12px;padding:14px 22px;margin-top:16px;font-weight:bold}.primary:disabled{opacity:.45}#score{font-size:24px;font-weight:bold}.muted{color:#52627a;font-size:15px}@media(max-width:600px){main{margin:0;padding:10px}.panel{padding:18px}}</style></head><body><main><header class="hero"><div class="small">CAP Métiers de la coiffure · Révisions interactives</div><h1>Les règles d’hygiène</h1><div>Pages 13 à 21 · 20 questions · Correction immédiate</div></header><section class="panel" id="game"><p id="progressLabel" class="muted"></p><div class="bar"><div class="fill" id="fill"></div></div><h2 id="question"></h2><div id="choices"></div><div id="feedback" class="feedback" hidden aria-live="polite"></div><button id="next" class="primary" disabled>Question suivante</button></section><section class="panel" id="end" hidden><h2>Quiz terminé !</h2><p id="score"></p><p id="message"></p><button id="restart" class="primary">Recommencer</button></section><p class="muted">Réalisé à partir du support de cours fourni. Ce quiz est un entraînement pédagogique.</p></main><script>const QUESTIONS=[{"q": "Pourquoi respecter les règles d’hygiène en salon ?", "a": ["Pour limiter les contaminations et protéger chacun", "Pour réduire la durée des coupes uniquement", "Pour éviter de conseiller le client"], "correct": 0, "why": "L’hygiène protège les clients, les professionnels et le matériel."}, {"q": "À quel moment l’hygiène doit-elle être respectée ?", "a": ["Seulement le matin", "Avant, pendant et après chaque prestation", "Uniquement à la fermeture"], "correct": 1, "why": "Le document insiste sur les trois moments de la prestation."}, {"q": "Quand entretenir un bac à shampooing ?", "a": ["Une fois par mois", "Seulement s’il est très sale", "Après chaque utilisation et lors de l’entretien du soir"], "correct": 2, "why": "Le tableau prévoit un nettoyage après chaque utilisation."}, {"q": "Que faut-il faire après chaque client au poste de travail ?", "a": ["Nettoyer et désinfecter les surfaces", "Changer les affiches", "Fermer le salon"], "correct": 0, "why": "Les plans de travail et fauteuils sont entretenus après chaque client."}, {"q": "Que faire des cheveux coupés au sol ?", "a": ["Les laisser jusqu’au lendemain", "Les balayer après chaque client", "Les déposer sur le fauteuil"], "correct": 1, "why": "Le tableau prévoit le balayage après chaque client."}, {"q": "Quand nettoyer les sanitaires ?", "a": ["Une fois par trimestre", "Seulement le dimanche", "Plusieurs fois par jour et en fin de journée"], "correct": 2, "why": "Les sanitaires nécessitent un entretien fréquent."}, {"q": "Quand le lavage des mains est-il obligatoire ?", "a": ["Avant et après chaque client", "Seulement à l’arrivée au salon", "Uniquement après le déjeuner"], "correct": 0, "why": "Le lavage des mains est demandé avant et après chaque client."}, {"q": "Après avoir manipulé du linge sale, il faut :", "a": ["Ranger immédiatement du linge propre", "Se laver les mains", "Se coiffer"], "correct": 1, "why": "La fiche d’hygiène des mains mentionne cette situation."}, {"q": "Quelle étape suit l’application du savon ?", "a": ["Sécher sans frotter", "Mettre des gants", "Frotter paumes, dos, doigts, espaces interdigitaux et ongles"], "correct": 2, "why": "Le frottement fait partie des six étapes du lavage."}, {"q": "Comment sécher ses mains selon le cours ?", "a": ["Avec un essuie-mains à usage unique", "Sur le peignoir du client", "Avec du linge sale"], "correct": 0, "why": "Le document prévoit un essuie-mains à usage unique."}, {"q": "Que vérifier avant de commencer une prestation ?", "a": ["La météo", "La propreté du poste et du matériel", "Le prix du café"], "correct": 1, "why": "Le coiffeur doit vérifier la propreté du poste et du matériel."}, {"q": "Que ne doit pas toucher directement la peau du cou ?", "a": ["La serviette propre", "Le col de protection", "Le peignoir ou la cape"], "correct": 2, "why": "La fiche précise que le peignoir ou la cape ne doit pas être en contact direct avec la peau du cou."}, {"q": "Quel accessoire protège les lunettes des produits colorants ?", "a": ["Le protège-lunettes", "Le bigoudi", "La balance"], "correct": 0, "why": "La liste des protections comprend le protège-lunettes."}, {"q": "À quoi sert une crème cutanée protectrice ?", "a": ["À nettoyer le miroir", "À protéger la peau des taches de couleur", "À désinfecter les ciseaux"], "correct": 1, "why": "Elle est appliquée pour protéger la peau lors de certaines techniques."}, {"q": "Quel équipement protège le visage des résidus de sprays ?", "a": ["Une brosse", "Un peigne", "Un masque ou pare-laque"], "correct": 2, "why": "La fiche décrit le masque ou pare-laque."}, {"q": "Où placer une serviette utilisée ?", "a": ["Dans un bac réservé au linge sale", "Sur la réserve de linge propre", "Sur le comptoir de vente"], "correct": 0, "why": "Le linge sale est immédiatement séparé du linge propre."}, {"q": "Comment ranger le linge propre ?", "a": ["Mélangé au linge sale", "Dans une armoire ou un meuble fermé, à l’abri de la poussière", "Sur le sol"], "correct": 1, "why": "Le cours préconise un rangement protégé et séparé."}, {"q": "Quelle est la date de signature de l’arrêté historique présenté ?", "a": ["3 août 2026", "4 août 1955", "3 août 1955"], "correct": 2, "why": "Le cours cite l’arrêté du 3 août 1955, publié le 4 août."}, {"q": "À quelle origine appartiennent les cheveux et le sébum comme salissures ?", "a": ["Organique", "Minérale", "Chimique"], "correct": 0, "why": "Le cours classe cheveux, peau, sébum et sang parmi les salissures organiques."}, {"q": "À quelle origine appartiennent la coloration et la laque comme salissures ?", "a": ["Minérale", "Chimique", "Organique"], "correct": 1, "why": "Les produits capillaires sont des salissures d’origine chimique."}];let index=0,score=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;const x=QUESTIONS[index];$('progressLabel').textContent=`Question ${index+1} sur ${QUESTIONS.length} · Score actuel : ${score}`;$('fill').style.width=`${index/QUESTIONS.length*100}%`;$('question').textContent=x.q;$('choices').innerHTML='';$('feedback').hidden=true;$('next').disabled=true;$('next').textContent=index===QUESTIONS.length-1?'Voir mon résultat':'Question suivante';x.a.forEach((answer,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=`${String.fromCharCode(65+i)}. ${answer}`;b.onclick=()=>select(i);$('choices').appendChild(b)})}function select(i){if(answered)return;answered=true;const x=QUESTIONS[index];if(i===x.correct)score++;[...$('choices').children].forEach((b,j)=>{b.disabled=true;if(j===x.correct)b.classList.add('right');else if(j===i)b.classList.add('wrong')});$('feedback').hidden=false;$('feedback').textContent=(i===x.correct?'✓ Bonne réponse ! ':'✗ Pas tout à fait. ')+x.why;$('next').disabled=false}$('next').onclick=()=>{index++;if(index<QUESTIONS.length)render();else{ $('game').hidden=true;$('end').hidden=false;$('score').textContent=`${score} / ${QUESTIONS.length}`;$('message').textContent=score>=17?'Excellent travail !':score>=12?'Bon début : révise les questions difficiles.':'Relis ton cours puis recommence le quiz.'}};$('restart').onclick=()=>{index=0;score=0;$('end').hidden=true;$('game').hidden=false;render()};render();</script></body></html>
