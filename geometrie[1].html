<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz CAP coiffure — Géométrie et techniques</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;color:#17243b;margin:0;padding:20px}main{max-width:760px;margin:20px auto;background:white;padding:28px;border-radius:20px;box-shadow:0 6px 24px #16233a18}h1{color:#205e71}button{font:inherit;cursor:pointer;border:1px solid #cbd5e1;background:#fff;border-radius:12px;padding:14px;text-align:left}button:hover{background:#eef7f8}.answers{display:grid;gap:12px;margin:22px 0}.good{background:#e1f5e8!important;border-color:#238b51}.bad{background:#ffe5e5!important;border-color:#b93838}.primary{background:#205e71;color:white;text-align:center;border:0;padding:14px 22px}#feedback{font-weight:bold;min-height:30px}small{color:#64748b}.progress{height:9px;background:#e2e8f0;border-radius:9px;overflow:hidden}.progress div{height:100%;background:#205e71;transition:width .2s}</style></head><body><main><h1>Révisions CAP Coiffure</h1><p>Co-intervention Maths / Coiffure · Formes géométriques et techniques</p><div class="progress"><div id="bar"></div></div><p id="counter"></p><h2 id="question"></h2><div id="answers" class="answers"></div><p id="feedback" aria-live="polite"></p><button id="next" class="primary" hidden>Question suivante</button><p><small>Questions issues des pages 5, 6, 8, 13, 14, 15 et 16 du support professeur.</small></p></main><script>const questions=[{"page": "5", "question": "Un angle aigu mesure…", "options": ["moins de 90°", "exactement 90°", "plus de 90°"], "correct": 0}, {"page": "5", "question": "En coiffure, un angle obtus est dit…", "options": ["ouvert", "fermé", "droit"], "correct": 0}, {"page": "5", "question": "La diagonale avant est associée à…", "options": ["une coupe en V", "un carré plongeant", "une raie zigzag"], "correct": 1}, {"page": "5", "question": "La symétrie en coupe permet…", "options": ["de créer du volume uniquement", "un équilibre entre les deux côtés", "de mesurer la longueur"], "correct": 1}, {"page": "6", "question": "Quel visage est plus long que large ?", "options": ["rond", "allongé", "carré"], "correct": 1}, {"page": "6", "question": "Quelle forme de visage évoque un diamant ?", "options": ["hexagonale / losange", "rectangulaire", "ronde"], "correct": 0}, {"page": "6", "question": "Quel visage est rectiligne ?", "options": ["Ovale", "Rond", "Carré"], "correct": 2}, {"page": "8", "question": "Selon le tableau, quelle zone est particulièrement large pour un visage hexagonal ?", "options": ["la mâchoire", "les pommettes", "le front"], "correct": 1}, {"page": "8", "question": "Un visage rond est :", "options": ["Plus long que large", "Plus large que long", "Aussi long que large"], "correct": 2}, {"page": "8", "question": "Pour un visage ovale, la largeur représente environ…", "options": ["le double de la longueur", "la même mesure que la longueur", "la moitié de la longueur"], "correct": 2}, {"page": "13", "question": "Quel os du crâne forme la région du front ?", "options": ["L’os frontal", "L’os occipital", "L’os temporal"], "correct": 0}, {"page": "13", "question": "Quel os se situe à l’arrière du crâne ?", "options": ["L’os pariétal", "L’os occipital", "L’os frontal"], "correct": 1}, {"page": "13", "question": "Une raie médiane va…", "options": ["d’une oreille à l’autre", "de la pointe frontale à la pointe de nuque", "du coin de l’œil à la nuque"], "correct": 1}, {"page": "13", "question": "La raie transversale passe…", "options": ["d’une oreille à l’autre par le sommet", "de la pointe du nez au menton", "en zigzag"], "correct": 0}, {"page": "13", "question": "La raie 3/4 part…", "options": ["du milieu de l’œil", "du coin intérieur de l’œil", "de la pointe du nez"], "correct": 1}, {"page": "14", "question": "Quelle zone se trouve à l’arrière et en bas de la tête ?", "options": ["la calotte", "le vertex", "la nuque"], "correct": 2}, {"page": "14", "question": "Quelle zone est repérée avec la ligne des yeux et le centre de l’occipital ?", "options": ["la zone occipitale", "les côtés", "la calotte"], "correct": 0}, {"page": "14", "question": "À quoi servent les zones de repère anatomique ?", "options": ["à calculer le prix d’une coupe", "à travailler méthodiquement", "à choisir un shampooing"], "correct": 1}, {"page": "15", "question": "Quelle division va de la pointe frontale à la pointe de nuque ?", "options": ["transversale", "radiale", "médiane"], "correct": 2}, {"page": "15", "question": "Laquelle de ces séparations forme une séparation en tranche de melon ?", "options": ["Diagonale avant", "Horizontale", "Radiale"], "correct": 2}, {"page": "15", "question": "Quelles sont les distributions indiquées ?", "options": ["naturelle, perpendiculaire, par déplacement", "courte, moyenne, longue", "droite, gauche, centrale"], "correct": 0}, {"page": "16", "question": "Une projection faible correspond à…", "options": ["30° à 45°", "0° à 30°", "45° à 90°"], "correct": 1}, {"page": "16", "question": "Une projection forte correspond à…", "options": ["0° à 30°", "30° à 45°", "45° à 90°"], "correct": 2}, {"page": "16", "question": "Une mèche témoin fixe…", "options": ["ne bouge pas", "se déplace à chaque coupe", "est toujours diagonale"], "correct": 0}, {"page": "16", "question": "Lors d’une coupe, à quoi sert une mèche témoin ?", "options": ["À choisir la raie du client", "À délimiter la zone occipitale", "À servir de repère de longueur pour les mèches suivantes"], "correct": 2}];let i=0,score=0,answered=false;const el=id=>document.getElementById(id);function show(){answered=false;const q=questions[i];el('bar').style.width=(100*i/questions.length)+'%';el('counter').textContent='Question '+(i+1)+' / '+questions.length+' · Page '+q.page;el('question').textContent=q.question;el('feedback').textContent='';el('next').hidden=true;el('answers').innerHTML='';q.options.forEach((o,j)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+j)+'. '+o;b.onclick=()=>{if(answered)return;answered=true;if(j===q.correct)score++;[...el('answers').children].forEach((x,k)=>{x.disabled=true;if(k===q.correct)x.classList.add('good');else if(k===j)x.classList.add('bad')});el('feedback').textContent=j===q.correct?'Bonne réponse !':'La bonne réponse est : '+q.options[q.correct];el('next').hidden=false};el('answers').appendChild(b)})}el('next').onclick=()=>{i++;if(i<questions.length)show();else{el('bar').style.width='100%';el('counter').textContent='Quiz terminé';el('question').textContent='Ton score : '+score+' / '+questions.length;el('answers').innerHTML='';el('feedback').textContent='Tu peux recommencer pour progresser.';el('next').textContent='Recommencer';el('next').hidden=false;el('next').onclick=()=>location.reload()}};show();</script></body></html>
