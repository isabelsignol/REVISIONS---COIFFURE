<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Les anomalies du cuir chevelu — Quiz CAP coiffure</title><style>:root{--accent:#8546a2}*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17243c;font:18px Arial,sans-serif}main{max-width:780px;margin:30px auto;padding:18px}.hero{background:var(--accent);color:white;padding:28px;border-radius:20px}h1{font-size:clamp(26px,5vw,38px);margin:8px 0}.small{opacity:.9;font-size:16px}.panel{background:white;border-radius:18px;padding:26px;margin-top:18px;box-shadow:0 6px 24px #152a4a12}.bar{height:12px;background:#e3eaf2;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--accent);width:0;transition:width .2s}button{font:inherit;cursor:pointer}.choice{display:block;text-align:left;width:100%;border:2px solid #d9e1ed;border-radius:12px;padding:16px;margin:12px 0;background:white}.choice:hover:not(:disabled){border-color:var(--accent)}.choice:disabled{cursor:default}.right{background:#e4f7e9!important;border-color:#1a9448!important}.wrong{background:#fff0ef!important;border-color:#cf3b32!important}.feedback{padding:16px;border-radius:12px;background:#f0f5fc;margin-top:15px}.primary{background:var(--accent);border:0;color:white;border-radius:12px;padding:14px 22px;margin-top:16px;font-weight:bold}.primary:disabled{opacity:.45}#score{font-size:24px;font-weight:bold}.muted{color:#52627a;font-size:15px}@media(max-width:600px){main{margin:0;padding:10px}.panel{padding:18px}}</style></head><body><main><header class="hero"><div class="small">CAP Métiers de la coiffure · Révisions interactives</div><h1>Les anomalies du cuir chevelu</h1><div>Pages 8 à 12 · 20 questions · Correction immédiate</div></header><section class="panel" id="game"><p id="progressLabel" class="muted"></p><div class="bar"><div class="fill" id="fill"></div></div><h2 id="question"></h2><div id="choices"></div><div id="feedback" class="feedback" hidden aria-live="polite"></div><button id="next" class="primary" disabled>Question suivante</button></section><section class="panel" id="end" hidden><h2>Quiz terminé !</h2><p id="score"></p><p id="message"></p><button id="restart" class="primary">Recommencer</button></section><p class="muted">Réalisé à partir du support de cours fourni. Ce quiz est un entraînement pédagogique.</p></main><script>const QUESTIONS=[{"q": "Que signifie une hyposécrétion sébacée ?", "a": ["Un manque de sébum", "Un excès de coloration", "Une augmentation de densité"], "correct": 0, "why": "L’hyposécrétion correspond à une production insuffisante de sébum."}, {"q": "Que signifie une hypersécrétion sébacée ?", "a": ["Une absence de cheveux", "Un excès de sébum", "Une perte de pigmentation"], "correct": 1, "why": "L’hypersécrétion est une production excessive de sébum."}, {"q": "À quoi correspond la séborrhée ?", "a": ["Une forme de visage", "Une coupe", "Un excès de sébum avec cuir chevelu gras"], "correct": 2, "why": "La séborrhée est liée à l’hypersécrétion sébacée."}, {"q": "Quel aspect peut présenter une chevelure en cas de séborrhée ?", "a": ["Grasse et luisante", "Toujours blanche", "Uniquement frisée"], "correct": 0, "why": "Le document décrit notamment des cheveux brillants et huileux."}, {"q": "Quel conseil est proposé en cas de séborrhée ?", "a": ["Multiplier les produits gras", "Utiliser des produits adaptés et éviter les massages trop vigoureux", "Gratter fortement le cuir chevelu"], "correct": 1, "why": "Les précautions comprennent un entretien adapté et des gestes doux."}, {"q": "Qu’est-ce que le pityriasis ?", "a": ["Une forme de coupe", "Un type de permanente", "Une desquamation accélérée du cuir chevelu"], "correct": 2, "why": "Le pityriasis se manifeste par des squames ou pellicules."}, {"q": "Comment sont les pellicules du pityriasis simplex ?", "a": ["Sèches, fines et grisâtres", "Épaisses et toujours vertes", "Uniquement liquides"], "correct": 0, "why": "Le document présente le pityriasis simplex comme des pellicules sèches et fines."}, {"q": "Comment sont les pellicules du pityriasis stéatoïde ?", "a": ["Invisibles", "Grasses, épaisses, jaunâtres et collantes", "Toujours bleues"], "correct": 1, "why": "Le pityriasis stéatoïde comporte des squames grasses et collantes."}, {"q": "Quel produit est évoqué pour l’état pelliculaire ?", "a": ["Une laque forte", "Une poudre décolorante", "Un shampooing ou soin traitant adapté"], "correct": 2, "why": "Le cours recommande un shampooing et/ou un soin adapté."}, {"q": "Qu’est-ce qu’une dermite ?", "a": ["Une inflammation des couches superficielles de la peau", "Une technique de coupe", "Une forme galénique"], "correct": 0, "why": "La dermite est définie comme une inflammation cutanée."}, {"q": "Quel signe est associé à la dermite séborrhéique ?", "a": ["Des cheveux systématiquement lisses", "Des plaques rouges avec squames et démangeaisons", "Une pousse instantanée"], "correct": 1, "why": "Le document présente rougeurs, squames, prurit et sensibilité."}, {"q": "Quelle conduite est conseillée en présence d’une dermite ?", "a": ["Appliquer une décoloration immédiatement", "Gratter les croûtes", "Conseiller une consultation dermatologique"], "correct": 2, "why": "Le cours recommande de consulter un dermatologue."}, {"q": "Quel signe est associé à la dermite eczémateuse ?", "a": ["Prurit, croûtes et parfois chute de cheveux", "Cheveux toujours plus longs", "Absence totale de gêne"], "correct": 0, "why": "La fiche mentionne prurit, vésicules, croûtes et chute de cheveux."}, {"q": "La teigne est due à :", "a": ["Un excès de shampooing", "Un champignon microscopique", "Une brosse trop large"], "correct": 1, "why": "La teigne est une anomalie fongique contagieuse."}, {"q": "Quel signe peut faire suspecter une teigne ?", "a": ["Des cheveux plus brillants", "Des boucles naturelles", "Une perte de cheveux par plaques avec squames"], "correct": 2, "why": "La fiche décrit des zones de perte de cheveux et une peau écailleuse."}, {"q": "Les poux sont :", "a": ["Des parasites externes contagieux", "Des bactéries du shampooing", "Des produits chimiques"], "correct": 0, "why": "Les poux sont des parasites externes du cuir chevelu."}, {"q": "Où observe-t-on fréquemment des signes de poux ?", "a": ["Sur les chaussures", "À la nuque et derrière les oreilles", "Sur le miroir uniquement"], "correct": 1, "why": "Le document cite notamment la nuque et l’arrière des oreilles."}, {"q": "Quelle mesure est adaptée face aux poux ?", "a": ["Partager les peignes", "Ignorer le linge", "Nettoyer et désinfecter les peignes et brosses"], "correct": 2, "why": "La fiche insiste sur le traitement du linge et du matériel."}, {"q": "La gale est causée par :", "a": ["Un acarien parasite", "Une coloration", "Un excès de brushing"], "correct": 0, "why": "La gale est une affection parasitaire très contagieuse."}, {"q": "Face à une anomalie parasitaire suspectée, le coiffeur doit :", "a": ["Poursuivre sans précaution", "Orienter vers un professionnel de santé et respecter les mesures d’hygiène", "Poser un diagnostic médical définitif"], "correct": 1, "why": "Le coiffeur observe et oriente ; il ne pose pas de diagnostic médical."}];let index=0,score=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;const x=QUESTIONS[index];$('progressLabel').textContent=`Question ${index+1} sur ${QUESTIONS.length} · Score actuel : ${score}`;$('fill').style.width=`${index/QUESTIONS.length*100}%`;$('question').textContent=x.q;$('choices').innerHTML='';$('feedback').hidden=true;$('next').disabled=true;$('next').textContent=index===QUESTIONS.length-1?'Voir mon résultat':'Question suivante';x.a.forEach((answer,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=`${String.fromCharCode(65+i)}. ${answer}`;b.onclick=()=>select(i);$('choices').appendChild(b)})}function select(i){if(answered)return;answered=true;const x=QUESTIONS[index];if(i===x.correct)score++;[...$('choices').children].forEach((b,j)=>{b.disabled=true;if(j===x.correct)b.classList.add('right');else if(j===i)b.classList.add('wrong')});$('feedback').hidden=false;$('feedback').textContent=(i===x.correct?'✓ Bonne réponse ! ':'✗ Pas tout à fait. ')+x.why;$('next').disabled=false}$('next').onclick=()=>{index++;if(index<QUESTIONS.length)render();else{ $('game').hidden=true;$('end').hidden=false;$('score').textContent=`${score} / ${QUESTIONS.length}`;$('message').textContent=score>=17?'Excellent travail !':score>=12?'Bon début : révise les questions difficiles.':'Relis ton cours puis recommence le quiz.'}};$('restart').onclick=()=>{index=0;score=0;$('end').hidden=true;$('game').hidden=false;render()};render();</script></body></html>
